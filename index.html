<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#264a6b" />
    <title>Gestão Integrada</title>
    <meta name="description" content="Gestão integrada de ferramentas e veículos da Engemase Engenharia." />
    <meta name="author" content="Engemase Engenharia" />
    <!-- Sistema interno: não indexar em buscadores -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gestão Integrada" />

    <!-- Prévia ao compartilhar o link (WhatsApp etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gestão Integrada" />
    <meta property="og:description" content="Gestão integrada de ferramentas e veículos da Engemase Engenharia." />
    <meta property="og:url" content="https://gestao-integrada-engemase.vercel.app/" />
    <meta property="og:image" content="https://gestao-integrada-engemase.vercel.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://gestao-integrada-engemase.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Engemase Engenharia — Gestão Integrada" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://gestao-integrada-engemase.vercel.app/og-image.png" />

    <!-- Tema e tela de abertura antes do React (ver public/boot.js) -->
    <script src="/boot.js"></script>
  </head>

  <body>
    <!-- Splash Screen (unique loading - hidden by React when ready) -->
    <div id="splash-screen" role="status" aria-label="Carregando aplicativo">
      <div class="splash-orb splash-orb-a" aria-hidden="true"></div>
      <div class="splash-orb splash-orb-b" aria-hidden="true"></div>
      <div class="splash-content">
        <div class="splash-logo-wrap">
          <div class="splash-logo-ring" aria-hidden="true"></div>
          <img src="/icon.png" alt="Engemase" class="splash-logo" />
        </div>
        <h1 class="splash-title">Gestão Integrada</h1>
        <p class="splash-subtitle">Engemase Engenharia</p>
        <div class="splash-progress" aria-hidden="true">
          <div class="splash-progress-bar"></div>
        </div>
        <p class="splash-tagline">Controle inteligente de ferramentas e veículos</p>
      </div>
    </div>
    <style>
      #splash-screen {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: radial-gradient(ellipse at top, #2e5a82 0%, #1a3654 45%, #112540 100%);
        overflow: hidden;
        transition: opacity 400ms ease, transform 400ms ease;
        animation: splash-in 500ms ease both;
      }
      #splash-screen.splash-out { opacity: 0; transform: scale(1.02); }
      .splash-content {
        position: relative; z-index: 2;
        display: flex; flex-direction: column; align-items: center;
        text-align: center; padding: 2rem; max-width: 320px;
      }
      .splash-orb {
        position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.45;
        animation: splash-float 8s ease-in-out infinite;
      }
      .splash-orb-a { width: 280px; height: 280px; background: #3b82f6; top: -60px; left: -60px; }
      .splash-orb-b { width: 320px; height: 320px; background: #06b6d4; bottom: -80px; right: -80px; animation-delay: -4s; }
      .splash-logo-wrap {
        position: relative; width: 96px; height: 96px;
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 1.5rem;
        animation: splash-pop 700ms cubic-bezier(.2,.9,.3,1.2) both;
      }
      .splash-logo-ring {
        position: absolute; inset: -6px; border-radius: 24px;
        background: conic-gradient(from 0deg, transparent, #60a5fa, transparent 60%);
        animation: splash-spin 2.2s linear infinite;
        -webkit-mask: radial-gradient(circle, transparent 58%, #000 60%);
                mask: radial-gradient(circle, transparent 58%, #000 60%);
      }
      .splash-logo {
        width: 80px; height: 80px; object-fit: contain;
        background: rgba(255,255,255,0.06); border-radius: 20px;
        padding: 12px; backdrop-filter: blur(8px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.1);
      }
      .splash-title {
        font-size: 1.6rem; font-weight: 700; color: #f8fafc;
        margin: 0 0 0.35rem 0; letter-spacing: -0.02em;
        animation: splash-rise 600ms 150ms ease both;
      }
      .splash-subtitle {
        font-size: 0.75rem; color: #7dd3fc; font-weight: 600;
        letter-spacing: 0.12em; text-transform: uppercase;
        margin: 0 0 1.75rem 0;
        animation: splash-rise 600ms 250ms ease both;
      }
      .splash-progress {
        width: 180px; height: 3px; border-radius: 999px;
        background: rgba(255,255,255,0.08); overflow: hidden;
        margin-bottom: 1.25rem;
        animation: splash-rise 600ms 350ms ease both;
      }
      .splash-progress-bar {
        width: 40%; height: 100%; border-radius: 999px;
        background: linear-gradient(90deg, transparent, #60a5fa, #06b6d4, transparent);
        animation: splash-slide 1.4s ease-in-out infinite;
      }
      .splash-tagline {
        font-size: 0.82rem; color: #94a3b8; margin: 0; line-height: 1.5;
        animation: splash-rise 600ms 450ms ease both;
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @keyframes splash-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes splash-pop {
        from { opacity: 0; transform: scale(0.6); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes splash-rise {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes splash-slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      @keyframes splash-float {
        0%, 100% { transform: translate(0,0) scale(1); }
        50%      { transform: translate(20px,-30px) scale(1.1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash-screen, .splash-logo-wrap, .splash-logo-ring, .splash-progress-bar,
        .splash-orb, .splash-title, .splash-subtitle, .splash-progress, .splash-tagline {
          animation: none !important;
        }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Service Worker é registrado pelo wrapper guardado em src/lib/registerSW.ts -->

  </body>
</html>
